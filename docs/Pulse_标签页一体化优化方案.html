<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse · 界面优化方案</title>
<style>
/* ============================================================
   设计要点
   1. 标签页与内容一体化：激活标签 = 工具栏/内容区同一“底板”色，
      底部用反向圆角“脚”无缝衔接（Chrome/Edge 式），取消蓝色顶线。
   2. 三层色阶：chrome(标题栏) → surface(底板) → pane(卡片)。
   3. 窗格工具按钮仅在悬停/激活时出现；激活窗格有强调色描边，
      全局地址栏始终跟随激活窗格。
   ============================================================ */
:root{
  --radius:10px; --tab-h:34px; --title-h:42px;
  --font: "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
}
[data-theme="dark"]{
  --chrome-rgb:21,23,28; --surface-rgb:29,32,38; --pane-rgb:34,37,44;
  --field:rgba(255,255,255,.055); --field-hover:rgba(255,255,255,.085); --field-solid:#2a2e36;
  --border:rgba(255,255,255,.065); --border-strong:rgba(255,255,255,.12);
  --text:#e7e9ee; --text-2:#b4bac4; --muted:#7f8691;
  --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.08);
  --accent:#5b9bff; --accent-soft:rgba(91,155,255,.16); --accent-ring:rgba(91,155,255,.55);
  --sel:rgba(91,155,255,.18); --sel-hover:rgba(91,155,255,.24);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.18);
  --folder:#f4c04e; --folder-2:#e0a82e; --scrim-default:.30; --frame-default:.50; --pane-default:.86; --blur-default:14;
  --title-shadow:0 1px 2px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --chrome-rgb:232,235,240; --surface-rgb:246,247,249; --pane-rgb:255,255,255;
  --field:rgba(16,24,40,.045); --field-hover:rgba(16,24,40,.075); --field-solid:#eceef2;
  --border:rgba(16,24,40,.08); --border-strong:rgba(16,24,40,.14);
  --text:#1b2230; --text-2:#475061; --muted:#6f7786;
  --hover:rgba(16,24,40,.045); --press:rgba(16,24,40,.08);
  --accent:#2f6fec; --accent-soft:rgba(47,111,236,.10); --accent-ring:rgba(47,111,236,.45);
  --sel:rgba(47,111,236,.11); --sel-hover:rgba(47,111,236,.16);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --folder:#f6c343; --folder-2:#e5a91f; --scrim-default:.50; --frame-default:.55; --pane-default:.90; --blur-default:14;
  --title-shadow:0 1px 1px rgba(255,255,255,.6);
}
/* 分层透明度：无背景时全部为 1（不透明）；背景图模式由 JS 写入 */
:root{--scrim:1;--frame-a:1;--pane-a:1;--bg-blur:0px}
[data-theme]{
  --chrome:rgba(var(--chrome-rgb),var(--scrim));
  --surface:rgba(var(--surface-rgb),var(--frame-a));
  --pane:rgba(var(--pane-rgb),var(--pane-a));
  --pane-2:rgba(var(--pane-rgb),calc(var(--pane-a) * .5));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.4 var(--font);color:var(--text);background:rgb(var(--chrome-rgb));overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;transition:background .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------------- 窗口骨架 ---------------- */
.app{display:grid;grid-template-rows:var(--title-h) 1fr;height:100vh;position:relative;z-index:1;background:var(--chrome);transition:background .25s}
/* 背景图层：模糊在图片层一次性完成（对应原生端可预先模糊缓存），面板本身不做实时 backdrop 模糊 */
.wallpaper{position:fixed;inset:0;z-index:0;background:center/cover no-repeat;opacity:0;transition:opacity .35s}
.wallpaper.blur{inset:calc(-2 * var(--bg-blur));filter:blur(var(--bg-blur)) saturate(1.1)}
body.has-bg .wallpaper{opacity:1}
body.has-bg .titlebar,body.has-bg .titlebar .tab:not(.active){text-shadow:var(--title-shadow)}
body.has-bg .pane,body.has-bg .details{box-shadow:0 1px 2px rgba(0,0,0,.12)}
body.has-bg .tab:not(.active) .t-badge{background:var(--field)}
[data-theme="dark"] body.has-bg{--field:rgba(255,255,255,.085);--field-hover:rgba(255,255,255,.13)}
[data-theme="light"] body.has-bg{--field:rgba(255,255,255,.62);--field-hover:rgba(255,255,255,.8)}
body.has-bg .address,body.has-bg .search{border-color:var(--border)}
body.has-bg .sidebar,body.has-bg .status{text-shadow:var(--title-shadow)}
body.has-bg .tab.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
[data-theme="light"] body.has-bg .tab.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
body.has-bg .tab:not(.active){color:var(--text)}
body.has-bg .side-item{color:var(--text)}
body.has-bg .win-actions .wa,body.has-bg .win-actions .wc,body.has-bg .new-tab{color:var(--text)}
[data-theme="light"] body.has-bg{--muted:#586071;--text-2:#343c4b}
body.has-bg .appear{--field:var(--field-solid);--field-hover:var(--field-solid);text-shadow:none}

/* ---------------- 标题栏 + 标签 ---------------- */
.titlebar{display:flex;align-items:flex-end;padding-left:12px;background:transparent;position:relative}
.brand{display:flex;align-items:center;gap:8px;height:var(--title-h);padding-right:14px;font-weight:600;letter-spacing:.2px}
.brand .logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#6aa8ff,#3b6ef5);display:grid;place-items:center}
.tabs{display:flex;align-items:flex-end;height:100%;min-width:0;flex:1}
.tab{position:relative;height:var(--tab-h);width:210px;min-width:72px;flex:0 1 210px;display:flex;align-items:center;
  padding:0 8px 0 12px;border-radius:var(--radius) var(--radius) 0 0;color:var(--text-2);cursor:default;transition:color .15s}
.tab-inner{position:absolute;inset:3px 2px 5px;border-radius:8px;transition:background .15s;z-index:0}
.tab:not(.active):hover .tab-inner{background:var(--hover)}
.tab>*:not(.tab-inner):not(.tab-sep){position:relative;z-index:1}
.tab-sep{position:absolute;left:0;top:10px;bottom:12px;width:1px;background:var(--border-strong);transition:opacity .15s}
.tab:first-child .tab-sep,.tab.active .tab-sep,.tab.active+.tab .tab-sep,.tab:hover .tab-sep,.tab:hover+.tab .tab-sep{opacity:0}
.tab .t-icon{margin-right:8px;display:flex}
.tab .t-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.tab .t-badge{font-size:11px;padding:0 6px;height:17px;line-height:17px;border-radius:9px;background:var(--field);color:var(--muted);margin-left:6px}
.tab .t-close{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;opacity:0;margin-left:4px;color:var(--muted)}
.tab:hover .t-close,.tab.active .t-close{opacity:1}
.tab .t-close:hover{background:var(--press);color:var(--text)}
.tab .t-close .ic{width:12px;height:12px}
/* 激活标签：与底板同色 + 反向圆角脚 */
.tab.active{background:var(--surface);color:var(--text);z-index:2}
.tab.active::before,.tab.active::after{content:"";position:absolute;bottom:0;width:var(--radius);height:var(--radius);pointer-events:none}
.tab.active::before{left:calc(-1 * var(--radius));background:radial-gradient(circle at 0 0,transparent calc(var(--radius) - .5px),var(--surface) var(--radius))}
.tab.active::after{right:calc(-1 * var(--radius));background:radial-gradient(circle at 100% 0,transparent calc(var(--radius) - .5px),var(--surface) var(--radius))}
.tab.active .t-badge{background:var(--accent-soft);color:var(--accent)}
.tab.enter{animation:tabIn .18s ease-out}
@keyframes tabIn{from{opacity:0;transform:translateY(4px)}}
.new-tab{width:30px;height:30px;margin:0 0 3px 6px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);flex:none}
.new-tab:hover{background:var(--hover);color:var(--text)}
.win-actions{display:flex;align-items:center;height:var(--title-h);margin-left:auto;flex:none}
.win-actions .wa{width:40px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-2)}
.win-actions .wa:hover{background:var(--hover);color:var(--text)}
.win-actions .wc{width:46px;height:var(--title-h);display:grid;place-items:center;color:var(--text-2)}
.win-actions .wc:hover{background:var(--hover)}
.win-actions .wc.close:hover{background:#e0433a;color:#fff}
.win-actions .div{width:1px;height:16px;background:var(--border-strong);margin:0 6px}

/* ---------------- 底板（工具栏 + 内容） ---------------- */
.sheet{background:var(--surface);display:grid;grid-template-rows:auto 1fr auto;min-height:0;transition:background .25s}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 10px}
.tb{height:32px;min-width:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text-2);padding:0 8px;transition:background .12s,color .12s}
.tb:hover{background:var(--hover);color:var(--text)}
.tb:active{background:var(--press)}
.tb[disabled]{opacity:.35;pointer-events:none}
.tb.icon{padding:0;width:32px}
.nav-group{display:flex;gap:2px}
.address{flex:1;min-width:120px;height:34px;display:flex;align-items:center;background:var(--field);border-radius:9px;padding:0 4px 0 6px;
  border:1px solid transparent;transition:background .15s,border-color .15s}
.address:hover{background:var(--field-hover)}
.address.focus{border-color:var(--accent-ring);background:rgb(var(--pane-rgb))}
.crumbs{display:flex;align-items:center;min-width:0;flex:1;overflow:hidden}
.crumb{height:26px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--text-2)}
.crumb:hover{background:var(--press);color:var(--text)}
.crumb:last-child{color:var(--text);font-weight:600}
.crumb-sep{color:var(--muted);display:flex}
.crumb-sep .ic{width:12px;height:12px}
.addr-input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:0 8px;display:none}
.address.editing .crumbs{display:none}.address.editing .addr-input{display:block}
.search{width:240px;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--field);border-radius:9px;color:var(--muted);
  border:1px solid transparent;transition:width .2s,background .15s,border-color .15s}
.search:focus-within{width:320px;border-color:var(--accent-ring);background:rgb(var(--pane-rgb))}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;min-width:0}
.search kbd{font:11px var(--font);padding:1px 5px;border-radius:4px;border:1px solid var(--border-strong);color:var(--muted)}
.btn-primary{height:32px;padding:0 12px 0 10px;border-radius:8px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 1px 2px rgba(0,0,0,.2)}
.btn-primary:hover{filter:brightness(1.08)}
.tsep{width:1px;height:18px;background:var(--border-strong);margin:0 4px}
.seg{display:flex;background:var(--field);border-radius:8px;padding:2px}
.seg button{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgb(var(--pane-rgb));color:var(--text);box-shadow:var(--shadow)}

/* ---------------- 主体 ---------------- */
.body{display:grid;grid-template-columns:232px 1fr 300px;gap:8px;padding:0 10px 0 6px;min-height:0}
.body.no-details{grid-template-columns:232px 1fr 0}
.body.no-details .details{display:none}

/* 侧边栏 */
.sidebar{display:flex;flex-direction:column;min-height:0;padding:2px 0 8px}
.side-scroll{flex:1;overflow:auto;padding-right:4px}
.side-group{margin-bottom:6px}
.side-head{display:flex;align-items:center;height:28px;padding:0 8px;color:var(--muted);font-size:12px;font-weight:600;gap:6px;border-radius:6px;cursor:default}
.side-head:hover{color:var(--text-2)}
.side-head .grow{flex:1}
.side-head .chev{transition:transform .2s}
.side-group.collapsed .chev{transform:rotate(-90deg)}
.side-group.collapsed .side-items{display:none}
.side-head .mini{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;opacity:0}
.side-head:hover .mini{opacity:1}.side-head .mini:hover{background:var(--press)}
.side-item{position:relative;display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--text-2);cursor:default}
.side-item:hover{background:var(--hover);color:var(--text)}
.side-item.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.side-item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.side-item>span:not(.meta):not(.dot){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.side-item .meta{flex:none;margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.tray{margin-top:8px;border:1.5px dashed var(--border-strong);border-radius:12px;padding:12px;color:var(--muted);font-size:12px;transition:all .15s;display:flex;gap:10px;align-items:center}
.tray b{display:block;color:var(--text-2);font-size:12.5px;margin-bottom:2px}
.tray .ti{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tray.over{border-color:var(--accent);background:var(--accent-soft)}

/* 窗格区域 */
.panes{display:grid;gap:8px;min-height:0;min-width:0}
.panes.l1{grid-template-columns:1fr;grid-template-rows:1fr}
.panes.l2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.panes.l3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panes.l3 .pane:first-child{grid-row:1 / span 2}
.pane{background:var(--pane);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;
  box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,background .2s;overflow:hidden}
.pane.active{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.panes.l1 .pane.active{border-color:var(--border);box-shadow:var(--shadow)}
.pane-head{display:flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 12px;flex:none}
.pane-title{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.pane-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-path{color:var(--muted);font-weight:400;font-size:12px}
.chip{font-size:11px;height:20px;padding:0 7px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.pane-tools{display:flex;gap:1px;margin-left:auto;opacity:0;transform:translateX(4px);transition:opacity .15s,transform .15s}
.pane:hover .pane-tools,.pane.active .pane-tools{opacity:1;transform:none}
.pane-tools .tb{height:28px;min-width:28px;width:28px;border-radius:7px}
.pane-tools .ic{width:15px;height:15px}
.cols{display:grid;grid-template-columns:1fr var(--c-date,128px) 84px;align-items:center;height:30px;margin:0 8px;padding:0 10px;
  border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;flex:none}
.pane.narrow .cols,.pane.narrow .row{grid-template-columns:1fr 84px}
.pane.narrow .c-date{display:none}
.col{display:flex;align-items:center;gap:4px;height:100%;cursor:default;white-space:nowrap}
.col:hover{color:var(--text)}
.col.sorted{color:var(--accent);font-weight:600}
.col.r{justify-content:flex-end}
.col .ic{width:11px;height:11px;stroke-width:2.2}
.list{flex:1;overflow:auto;padding:4px 8px 8px}
.row{display:grid;grid-template-columns:1fr var(--c-date,128px) 84px;align-items:center;height:30px;padding:0 10px;border-radius:7px;
  color:var(--text-2);cursor:default;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel);color:var(--text)}
.row.sel:hover{background:var(--sel-hover)}
.pane:not(.active) .row.sel{background:var(--hover)}
.row .n{display:flex;align-items:center;gap:10px;min-width:0}
.row .n .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.row .n .ext{color:var(--muted)}
.row .d{color:var(--muted);font-size:12.5px;white-space:nowrap}
.row .s{text-align:right;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.row .quick{position:absolute;right:100px;display:flex;gap:2px;opacity:0}
.row:hover .quick{opacity:1}
.row .quick button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.row .quick button:hover{background:var(--press);color:var(--text)}
.row .quick .ic{width:14px;height:14px}
.row .quick .starred{color:#f5b73b;opacity:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
.list::-webkit-scrollbar,.side-scroll::-webkit-scrollbar,.det-scroll::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-thumb,.side-scroll::-webkit-scrollbar-thumb,.det-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.list::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}

/* 详情面板 */
.details{background:var(--pane);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.det-scroll{overflow:auto;flex:1;padding:16px}
.det-preview{height:150px;border-radius:10px;background:var(--pane-2);border:1px solid var(--border);display:grid;place-items:center;margin-bottom:14px;
  background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:14px 14px}
.det-name{display:flex;align-items:flex-start;gap:8px}
.det-name h3{font-size:15px;font-weight:600;line-height:1.35;word-break:break-all;flex:1}
.det-sub{color:var(--muted);font-size:12px;margin:2px 0 14px}
.det-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.det-actions button{height:54px;border-radius:9px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--text-2)}
.det-actions button:hover{background:var(--field-hover);color:var(--text)}
.det-actions button.primary{background:var(--accent);color:#fff}
.det-actions button.primary:hover{filter:brightness(1.08)}
.det-sec{border-top:1px solid var(--border);padding:12px 0 6px}
.det-sec h4{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:8px;cursor:default}
.det-sec.collapsed .kv,.det-sec.collapsed .tags{display:none}
.det-sec.collapsed h4 .chev{transform:rotate(-90deg)}
.det-sec h4 .chev{transition:transform .2s;width:12px;height:12px}
.kv{display:grid;grid-template-columns:72px 1fr;row-gap:6px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{color:var(--text);word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{height:24px;padding:0 9px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--border-strong);color:var(--text-2);cursor:default}
.tag:hover{border-color:var(--muted)}
.tag.on{background:var(--accent-soft);border-color:var(--accent-ring);color:var(--text)}
.tag .dot{margin:0;width:7px;height:7px}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.on{color:#f5b73b}

/* 状态栏 */
.status{display:flex;align-items:center;gap:14px;height:30px;padding:0 16px;font-size:12px;color:var(--muted)}
.status .grow{flex:1}
.status .sep{width:1px;height:12px;background:var(--border-strong)}
.status .perf{font-variant-numeric:tabular-nums;display:flex;gap:12px}
.status .ok{display:inline-flex;align-items:center;gap:6px}
.status .ok::before{content:"";width:6px;height:6px;border-radius:50%;background:#3fb96b}

.appear{position:fixed;top:46px;right:96px;width:340px;z-index:50;background:rgb(var(--pane-rgb));border:1px solid var(--border-strong);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);padding:14px 16px 16px;display:none;user-select:none}
.appear.open{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.appear h5{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.appear .lbl{font-size:12px;color:var(--muted);margin:12px 0 6px;display:flex;justify-content:space-between}
.appear .lbl b{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:8px;padding:2px;gap:2px}
.seg2 button{height:28px;border-radius:6px;font-size:12px;color:var(--text-2)}
.seg2 button.on{background:var(--accent);color:#fff}
.wps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wp{aspect-ratio:16/10;border-radius:8px;background:center/cover;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden;
  display:grid;place-items:center;font-size:11px;color:var(--muted);background-color:var(--field)}
.wp:hover{border-color:var(--border-strong)}
.wp.on{border-color:var(--accent)}
.wp input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.appear .note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5;padding:8px 10px;background:var(--field);border-radius:8px}
.appear.disabled-img .img-only{opacity:.4;pointer-events:none}

/* toast */
.toast{position:fixed;z-index:60;left:50%;bottom:48px;transform:translate(-50%,10px);background:var(--text);color:rgb(var(--surface-rgb));padding:8px 14px;border-radius:9px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:all .2s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){.body{grid-template-columns:200px 1fr 0}.details{display:none}.search{width:180px}}
</style>

const isCJK=c=>/[\u3400-\u9fff]/.test(c);
const coll=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'});
const nameCmp=(a,b)=>{const x=isCJK(a[0]),y=isCJK(b[0]);return x!==y?(x?1:-1):coll.compare(a,b)};
function sorted(p){
  let items=[...listing(p.path)];
  if(p.q){const q=p.q.toLowerCase();items=items.filter(i=>i.name.toLowerCase().includes(q))}
  const {k,asc}=p.sort;
  items.sort((a,b)=>{if(a.dir!==b.dir)return b.dir?1:-1;let r=k==='size'?(a.size||0)-(b.size||0):k==='date'?String(a.date).localeCompare(String(b.date),'zh'):nameCmp(a.name,b.name);return asc?r:-r});
  return items;
}

  const vis=t.panes.slice(0,t.layout);

    const col=(k,label,cls='')=>`<div class="col ${cls} ${sk.k===k?'sorted':''} c-${k}" data-sort="${k}">${label}${sk.k===k?ic(sk.asc?'sort':'sortd'):''}</div>`;
    const narrow=t.layout===3&&pi===0||t.layout===2;
    return `<section class="pane ${pi===t.active?'active':''} ${narrow&&t.layout===3?'narrow':''}" data-p="${pi}">
      <div class="pane-head">
        <div class="pane-title">${fileIcon({dir:1},16)}<span>${leaf(p.path)}</span>${p.q?`<span class="chip">${ic('search','width:11px;height:11px')}"${p.q}"</span>`:`<span class="chip">${ic('clock','width:11px;height:11px')}${pi===0?'刚刚':'今天'}</span>`}</div>

      <div class="list">${items.length?items.map(it=>{
        const e=ext(it.name),st=state.stars.has(it.name);
        return `<div class="row ${p.sel.has(it.name)?'sel':''}" data-n="${encodeURIComponent(it.name)}" ${it.dir?'data-dir="1"':''}>
          <div class="n">${fileIcon(it)}<span class="nm">${it.dir||!e?it.name:base(it.name)}<span class="ext">${it.dir||!e?'':'.'+e}</span></span></div>
          <div class="d c-date">${it.date||''}</div><div class="s">${it.dir?'':fmtSize(it.size)}</div>
          <div class="quick"><button data-star title="星标" class="${st?'starred':''}">${ic('star',st?'fill:currentColor':'')}</button><button data-more title="更多">${ic('dots')}</button></div>
        </div>`}).join(''):`<div class="empty">没有匹配“${p.q}”的项目</div>`}</div>
    </section>`}).join('');
}

/* ============================ 交互 ============================ */
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600)}
function navigate(p,path,push=true){
  if(!path){path='C:'}
  p.path=path;p.sel=new Set();p.anchor=null;p.q='';
  if(push){p.hist=p.hist.slice(0,p.hi+1);p.hist.push(path);p.hi=p.hist.length-1}
  render();
}
function newTab(path=D){const t={id:++uid,layout:1,panes:[mkPane(path)],active:0};state.tabs.splice(state.cur+1,0,t);state.cur++;render(t.id)}
function closeTab(i){if(state.tabs.length===1){toast('至少保留一个标签页');return}state.tabs.splice(i,1);if(state.cur>=state.tabs.length||i<state.cur)state.cur=Math.max(0,state.cur-(i<=state.cur&&state.cur>0?1:0));if(state.cur>=state.tabs.length)state.cur=state.tabs.length-1;render()}

$('#tabs').addEventListener('mousedown',e=>{
  if(e.target.closest('.t-close'))return;
  const t=e.target.closest('.tab');if(!t)return;
  if(e.button===1){e.preventDefault();closeTab(+t.dataset.i);return}
  state.cur=+t.dataset.i;render();
});
$('#tabs').addEventListener('click',e=>{
  const c=e.target.closest('[data-close]');if(c){closeTab(+c.dataset.close);return}
  if(e.target.closest('#newTab'))newTab();
});
$('#tabs').addEventListener('dblclick',e=>{if(!e.target.closest('.tab'))newTab()});

$('#crumbs').addEventListener('click',e=>{const c=e.target.closest('[data-go]');if(c&&tab().kind!=='settings'){e.stopPropagation();navigate(pane(),c.dataset.go||'C:')}});
$('#address').addEventListener('click',e=>{
  if(e.target.closest('.crumb')||tab().kind==='settings')return;
  const a=$('#address'),inp=$('#addrInput');a.classList.add('editing','focus');inp.value=pane().path;inp.focus();inp.select();
});
$('#addrInput').addEventListener('keydown',e=>{if(e.key==='Enter'){navigate(pane(),e.target.value.trim());e.target.blur()}if(e.key==='Escape')e.target.blur()});

$('#navBack').onclick=()=>{const p=pane();if(p.hi>0){p.hi--;navigate(p,p.hist[p.hi],false)}};
$('#navFwd').onclick=()=>{const p=pane();if(p.hi<p.hist.length-1){p.hi++;navigate(p,p.hist[p.hi],false)}};

$('#navRefresh').onclick=()=>{renderPanes();toast('已刷新')};
$('#layoutSeg').onclick=e=>{const b=e.target.closest('button');if(!b||tab().kind==='settings')return;const t=tab(),l=+b.dataset.l;
  while(t.panes.length<l)t.panes.push(mkPane(pane().path));t.layout=l;if(t.active>=l)t.active=0;render()};
$('#detailsBtn').onclick=()=>{state.details=!state.details;render()};
$('#themeBtn').onclick=()=>{const h=document.documentElement;const d=h.dataset.theme==='dark';h.dataset.theme=d?'light':'dark';$('#themeBtn').innerHTML=ic(d?'moon':'sun');ap.scrim=ap.frame=ap.pane=null;applyAppearance()};
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const n=[...pane().sel];const m={new:'新建…',cut:'已剪切',copy:'已复制',paste:'粘贴',rename:'重命名',delete:'已移到回收站',settings:'打开设置'}[b.dataset.act];toast(m+(n.length&&['cut','copy','delete','rename'].includes(b.dataset.act)?` ${n.length} 项`:''))}));

// 窗格
const panesEl=$('#panes');
panesEl.addEventListener('mousedown',e=>{
  const pe=e.target.closest('.pane');if(!pe||tab().kind==='settings')return;
  const pi=+pe.dataset.p,t=tab();
  const changed=t.active!==pi;t.active=pi;const p=t.panes[pi];
  const row=e.target.closest('.row');
  if(e.target.closest('.quick')||e.target.closest('.pane-tools')||e.target.closest('.cols')){if(changed)render();return}
  if(row){
    const n=decodeURIComponent(row.dataset.n);
    if(e.ctrlKey){p.sel.has(n)?p.sel.delete(n):p.sel.add(n);p.anchor=n}
    else if(e.shiftKey&&p.anchor){const names=sorted(p).map(i=>i.name);const [a,b]=[names.indexOf(p.anchor),names.indexOf(n)].sort((x,y)=>x-y);p.sel=new Set(names.slice(a,b+1))}
    else{p.sel=new Set([n]);p.anchor=n}
  }else if(e.target.closest('.list')){p.sel=new Set()}
  render();
});
panesEl.addEventListener('dblclick',e=>{const row=e.target.closest('.row');if(!row)return;const n=decodeURIComponent(row.dataset.n);
  if(row.dataset.dir)navigate(pane(),pane().path+'\\'+n);else toast('打开 '+n)});
panesEl.addEventListener('click',e=>{
  const p=pane();
  const s=e.target.closest('[data-sort]');if(s){const k=s.dataset.sort;p.sort=p.sort.k===k?{k,asc:!p.sort.asc}:{k,asc:true};renderPanes();return}
  const star=e.target.closest('[data-star]');if(star){const n=decodeURIComponent(star.closest('.row').dataset.n);state.stars.has(n)?state.stars.delete(n):state.stars.add(n);render();return}
  const pa=e.target.closest('[data-pact]');if(pa){const a=pa.dataset.pact;
    if(a==='back')$('#navBack').click();else if(a==='up')$('#navUp').click();
    else if(a==='split'){const t=tab();if(t.layout<3){$('#layoutSeg').querySelector(`[data-l="${t.layout+1}"]`).click()}else toast('已达到最多 3 个窗格')}
    else toast(a==='filter'?'筛选':'更多操作');}
});

$('#details').addEventListener('click',e=>{

  if(e.target.closest('[data-dstar]')){state.stars.has(it.name)?state.stars.delete(it.name):state.stars.add(it.name);render();return}
  const tg=e.target.closest('[data-tag]');if(tg){const s=state.tags[it.name]||(state.tags[it.name]=new Set());const n=tg.dataset.tag;s.has(n)?s.delete(n):s.add(n);render();return}
  const a=e.target.closest('[data-dact]');if(!a)return;
  if(a.dataset.dact==='open'){it.dir&&!it.self?navigate(pane(),it.path):toast('打开 '+it.name)}
  else if(a.dataset.dact==='newtab'){it.dir?newTab(it.path):toast('仅文件夹可在新标签打开')}
  else if(a.dataset.dact==='copypath'){navigator.clipboard?.writeText(it.path).catch(()=>{});toast('已复制路径')}
  else toast('更多操作');
});

// 快捷键
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();newTab()}
  else if(e.ctrlKey&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(state.cur)}
  else if(e.ctrlKey&&e.key==='Tab'){e.preventDefault();state.cur=(state.cur+(e.shiftKey?-1:1)+state.tabs.length)%state.tabs.length;render()}
  else if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('#searchInput').focus()}
  else if(e.altKey&&e.key==='ArrowLeft')$('#navBack').click();
  else if(e.altKey&&e.key==='ArrowRight')$('#navFwd').click();
  else if(e.altKey&&e.key==='ArrowUp')$('#navUp').click();

const ap={effect:'image',wp:'mountain',scrim:null,frame:null,pane:null,blur:null};
function themeDefaults(){const cs=getComputedStyle(document.documentElement);return{scrim:+cs.getPropertyValue('--scrim-default'),frame:+cs.getPropertyValue('--frame-default'),pane:+cs.getPropertyValue('--pane-default'),blur:+cs.getPropertyValue('--blur-default')}}
function applyAppearance(){
  const root=document.documentElement.style,d=themeDefaults(),wpEl=$('#wallpaper');
  for(const k of ['scrim','frame','pane','blur'])if(ap[k]==null)ap[k]=d[k];
  const on=ap.effect!=='none';
  document.body.classList.toggle('has-bg',on);
  if(ap.effect==='image'){
    wpEl.style.backgroundImage=WP[ap.wp]||WP.mountain;
    // 对应原生 ui_renderer：scrim = micaTint.a；tab/工具栏/状态栏 = header_bg.a；面板卡片再叠一层
    root.setProperty('--scrim',ap.scrim);
    root.setProperty('--pane-a',ap.pane);
    root.setProperty('--frame-a',ap.frame);
    root.setProperty('--bg-blur',ap.blur+'px');
    wpEl.classList.toggle('blur',ap.blur>0);
  }else if(ap.effect==='mica'){
    // Mica：系统壁纸强模糊 + 淡色调；面板用 backdrop_enabled 的透明度
    wpEl.style.backgroundImage=WP.mountain;
    root.setProperty('--scrim',.80);root.setProperty('--frame-a',.6);root.setProperty('--pane-a',d.pane);
    root.setProperty('--bg-blur','60px');wpEl.classList.add('blur');
  }else{
    ['--scrim','--frame-a','--pane-a'].forEach(k=>root.setProperty(k,1));root.setProperty('--bg-blur','0px');wpEl.classList.remove('blur');
  }
  // 面板 UI 同步
  const pa=$('#appear');pa.classList.toggle('disabled-img',ap.effect!=='image');
  document.querySelectorAll('#effSeg button').forEach(b=>b.classList.toggle('on',b.dataset.e===ap.effect));
  document.querySelectorAll('.wp').forEach(e=>{const k=e.dataset.w;e.classList.toggle('on',k===ap.wp);if(WP[k])e.style.backgroundImage=WP[k]});
  $('#rScrim').value=Math.round(ap.scrim*100);$('#vScrim').textContent=Math.round(ap.scrim*100)+'%';
  $('#rFrame').value=Math.round(ap.frame*100);$('#vFrame').textContent=Math.round(ap.frame*100)+'%';
  $('#rPane').value=Math.round(ap.pane*100);$('#vPane').textContent=Math.round(ap.pane*100)+'%';
  $('#rBlur').value=ap.blur;$('#vBlur').textContent=ap.blur?ap.blur+' px':'关';
  // 可读性估算：侧边栏文字只压在 scrim + 底板上，内容区再叠一层卡片
  const sc=+getComputedStyle(document.documentElement).getPropertyValue('--scrim'),fr=+getComputedStyle(document.documentElement).getPropertyValue('--frame-a'),pn=+getComputedStyle(document.documentElement).getPropertyValue('--pane-a');
  const side=1-(1-sc)*(1-fr),content=1-(1-side)*(1-pn);
  const note=$('#appearNote');
  if(ap.effect==='none')note.textContent='无效果：所有层均为不透明实色。';
  else note.innerHTML=`标签栏 / 侧边栏遮盖度 <b>${Math.round(side*100)}%</b>，文件列表 <b>${Math.round(content*100)}%</b>。`+
    ((side<.6||(side<.8&&ap.effect==='image'&&ap.blur<8))?'<br><span style="color:#e5a13a">⚠ 背景透出较多且模糊较弱，高细节图片上侧边栏文字可能不清晰：建议模糊 ≥ 8px 或提高底板不透明度。</span>':'<br>✓ 可读性良好；背景在标题栏、侧边栏和卡片间隙可见。激活标签与工具栏同层同色，衔接无缝。');
}
$('#appearBtn').onclick=e=>{e.stopPropagation();$('#appear').classList.toggle('open')};
$('#appearClose').onclick=()=>$('#appear').classList.remove('open');
document.addEventListener('mousedown',e=>{if(!e.target.closest('#appear')&&!e.target.closest('#appearBtn'))$('#appear').classList.remove('open')});
$('#effSeg').onclick=e=>{const b=e.target.closest('button');if(b){ap.effect=b.dataset.e;applyAppearance()}};
$('#wps').onclick=e=>{const w=e.target.closest('.wp');if(!w||w.dataset.w==='custom'&&!WP.custom)return;ap.wp=w.dataset.w;applyAppearance()};
$('#wpFile').onchange=e=>{const f=e.target.files[0];if(!f)return;WP.custom=`url(${URL.createObjectURL(f)})`;ap.wp='custom';ap.effect='image';applyAppearance();toast('已应用本地背景图')};
$('#rScrim').oninput=e=>{ap.scrim=e.target.value/100;applyAppearance()};
$('#rPane').oninput=e=>{ap.pane=e.target.value/100;applyAppearance()};
$('#rFrame').oninput=e=>{ap.frame=e.target.value/100;applyAppearance()};
$('#rBlur').oninput=e=>{ap.blur=+e.target.value;applyAppearance()};
$('#resetAppear').onclick=()=>{ap.scrim=ap.frame=ap.pane=ap.blur=null;applyAppearance();toast('已恢复推荐值')};

hydrateIcons();
render();
applyAppearance();
</script>
</body>
</html>
