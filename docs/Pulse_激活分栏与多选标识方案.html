<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pulse 激活分栏与多选标识 — 效果图</title>
<style>
:root{
  --accent:#4CC2FF; --accent-strong:#0078D4;
}
body{margin:0;font:14px/1.45 "Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;background:#111;color:#eee}
body.light{background:#e9eef4;color:#1b1b1b}
.wrap{max-width:1320px;margin:0 auto;padding:24px 28px 48px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:34px 0 6px}
p.lead,.note{color:#aab;margin:4px 0 14px;max-width:980px}
body.light p.lead,body.light .note{color:#556}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.seg{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid #444}
body.light .seg{border-color:#bbb}
.seg button{background:transparent;color:inherit;border:0;padding:6px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent-strong);color:#fff}
.lbl{opacity:.7;margin-right:2px}

/* ---------- window ---------- */
.win{--title:#1a1a1a;--sheet:#202020;--card:#272727;--text:#fff;--text2:#c5c5c5;--stroke:rgba(255,255,255,.08);
  --sel:rgba(76,194,255,.20);--selgray:rgba(255,255,255,.09);--hover:rgba(255,255,255,.05);--zebra:rgba(255,255,255,.025);
  --acc:#4CC2FF;border-radius:8px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);background:var(--sheet);color:var(--text);user-select:none}
body.light .win{--title:#ebebeb;--sheet:#f9f9f9;--card:#fff;--text:#1b1b1b;--text2:#5d5d5d;--stroke:rgba(0,0,0,.08);
  --sel:rgba(0,120,212,.13);--selgray:rgba(0,0,0,.06);--hover:rgba(0,0,0,.04);--zebra:rgba(0,0,0,.022);--acc:#0078D4}
.title{height:40px;background:var(--title);display:flex;align-items:flex-end;padding-left:12px;gap:4px}
.tab{height:32px;padding:0 14px;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0;font-size:13px}
.tab.on{background:var(--sheet)}
.tab .x{opacity:.5;margin-left:18px}
.toolbar{height:42px;display:flex;align-items:center;padding:0 12px;gap:10px}
.addr{flex:1;height:30px;border-radius:5px;background:var(--card);border:1px solid var(--stroke);display:flex;align-items:center;padding:0 10px;color:var(--text2);font-size:13px}
.body{display:flex;height:360px;padding:4px 4px 0}
.side{width:112px;padding:6px 8px;font-size:13px;color:var(--text)}
.side div{padding:6px 8px;border-radius:5px}
.side .cur{background:var(--hover)}
.panes{flex:1;display:flex;gap:4px;min-width:0}
.pane{flex:1;min-width:0;background:var(--card);border-radius:6px;position:relative;display:flex;flex-direction:column;cursor:pointer;transition:opacity .15s, background .15s}
.pane::after{content:"";position:absolute;inset:0;border-radius:6px;border:1px solid var(--stroke);pointer-events:none;transition:border-color .15s, box-shadow .15s}
.phead{height:38px;display:flex;align-items:center;padding:0 12px;gap:8px;font-weight:600;font-size:14px}
.phead .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:none}
.phead .path{font-weight:400;font-size:12px;color:var(--text2);margin-left:auto}
.cols{display:flex;padding:0 12px 4px;font-size:12px;color:var(--text2)}
.cols span:first-child,.row span:first-child{flex:1}
.cols span,.row span{width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols span:first-child,.row span:first-child{flex:1 1 auto;width:auto;min-width:0}
.cols span:not(:first-child),.row span:not(:first-child){flex:none;font-size:12px}
.cols span:last-child,.row span:last-child{width:56px}
.grid>div,.minis>div{min-width:0}
.rows{padding:0 6px;overflow:hidden}
.row{display:flex;align-items:center;height:30px;padding:0 8px;border-radius:5px;font-size:13px;position:relative}
.row:nth-child(even){background:var(--zebra)}
.row .ic{width:16px;height:13px;border-radius:2px;background:#E8B64C;margin-right:9px;flex:none}
.row .ic.f{background:#8aa2b8;height:15px;width:12px;margin:0 11px 0 2px}
.row span.n{display:flex;align-items:center;overflow:hidden;padding-right:8px}
.row .t{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row span:not(:first-child){color:var(--text2)}
.row.sel{background:var(--sel)}
.row.caret-bar::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--acc)}
.row.caret-ring{box-shadow:inset 0 0 0 1px var(--acc)}
.status{height:28px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--text2)}

/* ---------- active-pane schemes ---------- */
/* now: accent 28% 1.5px */
.s-now .pane.active::after{border:1.5px solid color-mix(in srgb,var(--acc) 28%,transparent)}
/* A: solid accent frame */
.s-a .pane.active::after{border:1.5px solid var(--acc)}
/* B: frame + inactive selection gray + header dot */
.s-b .pane.active::after,.s-c .pane.active::after{border:1.5px solid var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
.s-b .pane:not(.active) .row.sel,.s-c .pane:not(.active) .row.sel{background:var(--selgray)}
.s-b .pane.active .phead .dot,.s-c .pane.active .phead .dot{display:block}
.s-b .pane:not(.active) .phead,.s-c .pane:not(.active) .phead{color:var(--text2);font-weight:500}
.s-b .pane:not(.active) .row.caret-bar::before,.s-c .pane:not(.active) .row.caret-bar::before{background:var(--text2)}
.s-b .pane:not(.active) .row.caret-ring,.s-c .pane:not(.active) .row.caret-ring{box-shadow:none}
/* C: B + dim inactive */
.s-c .pane:not(.active){background:color-mix(in srgb,var(--card) 55%,transparent)}
.s-c .pane:not(.active) .rows,.s-c .pane:not(.active) .cols{opacity:.62}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cap{margin:10px 0 0;font-size:13px}
.cap b{font-size:14px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--accent-strong);color:#fff;margin-left:6px;vertical-align:1px}
.tag.gray{background:#666}
.cap ul{margin:4px 0 0;padding-left:18px;color:#aab}
body.light .cap ul{color:#556}

/* ---------- multi-select mini ---------- */
.mini{background:var(--card);border-radius:6px;padding:6px;border:1px solid var(--stroke)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.minis .win{box-shadow:0 6px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="wrap">
  <h1>激活分栏 · 多选标识 — 效果图</h1>
  <p class="lead">点击任意分栏可以切换激活状态。每张图都是同一个双栏窗口，左栏多选了 3 项，右栏选中了 1 项。“现状”一栏按 Pulse 当前的实际绘制参数还原：激活分栏只有 28% 透明度的强调色描边，多选时只有焦点行带竖条。</p>

  <div class="bar">
    <span class="lbl">主题</span>
    <span class="seg" id="theme"><button data-v="dark" class="on">深色</button><button data-v="light">浅色</button></span>
    <span class="lbl" style="margin-left:14px">多选标识</span>
    <span class="seg" id="caret"><button data-v="bar">竖条（现状）</button><button data-v="none" class="on">去掉</button><button data-v="ring">焦点细框</button></span>
  </div>

  <h2>一、怎么一眼看出哪个分栏是激活的</h2>
  <div class="grid" id="schemes"></div>

  <h2>二、多选时的焦点标识</h2>
  <p class="note">竖条标的是“键盘焦点行”：Shift+方向键从这一行开始扩展，空格键切换的也是这一行，所以它本来就只会出现在一行上。问题在于它和“选中”挤在一起，看上去像“只有这一项特别”。下面三种处理方式并排对比，选中行都相同。</p>
  <div class="minis" id="minis"></div>
</div>

<script>
const files=[["Arena模型助手-DEV063","周五 21:08","文件夹",0],["DeskMint","8月23日","文件夹",0],["Desktop","8月25日","文件夹",0],["file-unlocker","8月15日","文件夹",0],["LumaShot","9月17日","文件夹",0],["LUMENUI","周二 21:50","文件夹",0],["report.docx","昨天 18:02","Word 文档",1],["notes.txt","9月20日","文本文档",1],["plot.pdf","9月5日","PDF",1],["setup.exe","6月4日","应用程序",1]];
const leftSel=new Set([1,2,4]), leftCaret=2, rightSel=new Set([7]), rightCaret=7;
let caretMode="none";
function rows(sel,caret){return files.map((f,i)=>{let c="row";if(sel.has(i)){c+=" sel";if(i===caret){c+=caretMode==="bar"?" caret-bar":caretMode==="ring"?" caret-ring":""}}
 return `<div class="${c}"><span class="n"><i class="ic ${f[3]?'f':''}"></i><b class="t">${f[0]}</b></span><span>${f[1]}</span><span>${f[2]}</span></div>`}).join("")}
function pane(name,path,sel,caret,active,idx){return `<div class="pane ${active?'active':''}" data-i="${idx}">
 <div class="phead"><i class="dot"></i>${name}<span class="path">${path}</span></div>
 <div class="cols"><span>名称</span><span>修改日期</span><span>类型</span></div>
 <div class="rows">${rows(sel,caret)}</div></div>`}
function win(scheme,active,compact){return `<div class="win ${scheme}">
 <div class="title"><div class="tab on">📁 Desktop<span class="x">✕</span></div><div class="tab" style="opacity:.75">📁 Downloads</div></div>
 <div class="toolbar"><div class="addr">此电脑 › C: › Users › W › Desktop</div></div>
 <div class="body" style="${compact?'height:250px':''}">${compact?'':'<div class="side"><div>★ 星标项目</div><div>最近使用</div><div class="cur">桌面</div><div>Downloads</div><div>回收站</div></div>'}
 <div class="panes">${pane("Desktop","C:\\Users\\W",leftSel,leftCaret,active===0,0)}${compact?'':pane("Downloads","C:\\Users\\W",rightSel,rightCaret,active===1,1)}</div></div>
 <div class="status">${compact?'已选中 3 项':'左栏已选中 3 项 · 右栏 1 项'}</div></div>`}
const schemes=[
 ["s-now","现状","gray",["激活分栏：强调色 28% 透明度、1.5px 描边","未激活分栏里的选中行也是蓝色，看起来像“两个都激活”"]],
 ["s-a","A · 实色描边","gray",["激活分栏的描边改为实色强调色，其余都不变","改动最小，但两个分栏的选中行都还是蓝的"]],
 ["s-b","B · 描边 + 失焦变灰","",["实色描边外加一圈很淡的光晕；标题前加一个强调色小圆点","未激活分栏：选中行变灰、标题变成次要文字色（同资源管理器 / VS Code）","内容亮度不变，右栏仍然方便阅读"]],
 ["s-c","C · B + 淡化未激活栏","gray",["在 B 的基础上，把未激活分栏的卡片和内容降低不透明度","最醒目，但未激活栏的文字对比度下降，开背景图时更明显"]]];
let actives=schemes.map(()=>0);
function render(){
 document.getElementById("schemes").innerHTML=schemes.map((s,k)=>`<div>${win(s[0],actives[k],false).replace('class="win','data-k="'+k+'" class="win')}
  <div class="cap"><b>${s[1]}</b>${k===2?'<span class="tag">推荐</span>':''}<ul>${s[3].map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`).join("");
 const saved=caretMode; const modes=[["bar","竖条（现状）","只有焦点行有竖条，容易误解成只选中了这一项"],["none","去掉竖条","选中行一律只用底色表示；键盘焦点行不再单独标出","推荐"],["ring","焦点行细框","焦点行只画一圈 1px 细框；只在多选或用键盘操作时出现"]];
 document.getElementById("minis").innerHTML=modes.map(m=>{caretMode=m[0];const h=win("s-b",0,true);return `<div>${h}<div class="cap"><b>${m[1]}</b>${m[3]?'<span class="tag">推荐</span>':''}<ul><li>${m[2]}</li></ul></div></div>`}).join("");
 caretMode=saved;
 document.querySelectorAll("#schemes .pane").forEach(p=>p.onclick=()=>{const k=+p.closest(".win").dataset.k;actives[k]=+p.dataset.i;render()});
}
function seg(id,fn){const el=document.getElementById(id);el.onclick=e=>{const b=e.target.closest("button");if(!b)return;el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));fn(b.dataset.v)}}
seg("theme",v=>{document.body.classList.toggle("light",v==="light")});
seg("caret",v=>{caretMode=v;render()});
render();
</script>
</body>
</html>
